# Single source of truth for paths and experiment parameters.
paths:
  raw: data/raw
  processed: data/processed
  reports: reports
leagues: [E0, I1, SP1]            # EPL, Serie A, La Liga
odds:
  # First complete source wins, per row; the source used is stored with the row.
  closing_priority:
    - {name: PS,  cols: [PSCH, PSCD, PSCA]}
    - {name: Avg, cols: [AvgCH, AvgCD, AvgCA]}
  pre_priority:
    - {name: PS,   cols: [PSH, PSD, PSA]}
    - {name: B365, cols: [B365H, B365D, B365A]}
  # Best price across bookmakers (football-data "Max" columns; ADR 0004).
  max_pre_priority:
    - {name: Max,  cols: [MaxH, MaxD, MaxA]}
  max_close_priority:
    - {name: MaxC, cols: [MaxCH, MaxCD, MaxCA]}
  # Closing over/under 2.5 goals: [over, under] (ADR 0005).
  ou_close_priority:
    - {name: PS,  cols: ["PC>2.5", "PC<2.5"]}
    - {name: Avg, cols: ["AvgC>2.5", "AvgC<2.5"]}
evaluation:
  first_test_season: 2018          # season = start year (2018 = 2018/19)
  last_test_season: 2025
  min_train_matches: 1500
  refit_frequency: weekly          # see docs/adr/0002
models:
  team_blind: {}
  elo:
    k: 20.0                 # rating change per unit of surprise
    home_advantage: 60.0    # Elo points added to the home side
    initial_rating: 1500.0
    promoted_gap: 0.0       # new team starts at mean of league's bottom 3, minus this
    burn_in_seasons: 1      # first seasons of history not used to fit the H/D/A mapping
  dixon_coles:
    xi: 0.0025              # time decay per day (half-life ~9 months); tuned on 2018-19, locked
    ridge: 1.0              # pull of team ratings towards their prior; tuned on 2018-19, locked
    max_goals: 10
    no_crowd_start: "2020-06-01"
    no_crowd_end: "2021-05-31"
    min_promoted_matches: 5
    shots_weight: 0.25      # 0 = goals only, 1 = shots on target only; tuned on 2018-19, locked
  dixon_coles_h2h:          # dixon_coles + head-to-head (ADR 0005); nothing retuned
    xi: 0.0025              # time decay per day (half-life ~9 months); tuned on 2018-19, locked
    ridge: 1.0              # pull of team ratings towards their prior; tuned on 2018-19, locked
    max_goals: 10
    no_crowd_start: "2020-06-01"
    no_crowd_end: "2021-05-31"
    min_promoted_matches: 5
    shots_weight: 0.25      # 0 = goals only, 1 = shots on target only; tuned on 2018-19, locked
    use_h2h: true
    h2h_max_meetings: 6
    h2h_years: 5.0
    h2h_shrink: 2.0
  dixon_coles_lineup:       # dixon_coles + line-up strength (ADR 0007); nothing retuned
    xi: 0.0025
    ridge: 1.0
    max_goals: 10
    no_crowd_start: "2020-06-01"
    no_crowd_end: "2021-05-31"
    min_promoted_matches: 5
    shots_weight: 0.25
    covariates: [lineup]
  dixon_coles_trust:        # dixon_coles + coach's-trust XI strength (ADR 0007 amendment)
    xi: 0.0025
    ridge: 1.0
    max_goals: 10
    no_crowd_start: "2020-06-01"
    no_crowd_end: "2021-05-31"
    min_promoted_matches: 5
    shots_weight: 0.25
    covariates: [trust]
  dixon_coles_dynamic:      # challenger: ratings that move over time (ADR 0022)
    xi: 0.0                 # tuned on 2018-19 (reports/tuning/dixon_coles_dynamic.csv), locked
    ridge: 1.0
    max_goals: 10
    no_crowd_start: "2020-06-01"
    no_crowd_end: "2021-05-31"
    min_promoted_matches: 5
    shots_weight: 0.25
    dynamic_weeks: 8        # tuned, locked: ratings may change every 8 weeks
    rw: 160.0               # tuned, locked (the slowest change in the grid won)
  dixon_coles_manager:      # dixon_coles + new-manager flag (ADR 0007); nothing retuned
    xi: 0.0025
    ridge: 1.0
    max_goals: 10
    no_crowd_start: "2020-06-01"
    no_crowd_end: "2021-05-31"
    min_promoted_matches: 5
    shots_weight: 0.25
    covariates: [manager]
tuning:
  # Settings are chosen on these test seasons only, then locked in models: above.
  # Seasons after them are never used for choosing, so their results stay honest.
  dixon_coles:
    seasons: [2018, 2019]
    grid:
      xi: [0.0019, 0.0025, 0.0035]
      ridge: [1.0, 2.0, 4.0]
      shots_weight: [0.0, 0.25, 0.5, 0.75, 1.0]
  dixon_coles_dynamic:      # ADR 0022, pre-registered grid
    seasons: [2018, 2019]
    grid:
      dynamic_weeks: [4, 8]
      rw: [10.0, 40.0, 160.0]
      xi: [0.0, 0.0025]
predict:
  model: dixon_coles        # the evaluated model; predict uses its locked settings unchanged
  odds_source: Avg          # for football-data fixtures.csv: Avg, Max, B365 or PS prices
  max_data_age_days: 10     # warn when our latest result is older than this before kick-off
  aliases: configs/team_aliases.yaml
staking:                    # docs/adr/0006-staking-policy.md
  monthly_budget: 10000     # assumption until Harsh sets his own
  currency: INR
  # [min probability, share of monthly budget] for tiers low, normal, high.
  # Two-way markets start higher: 55% on over/under is barely better than a coin.
  tiers:
    1x2:  [[0.50, 0.01], [0.60, 0.02], [0.70, 0.03]]
    ou25: [[0.58, 0.01], [0.65, 0.02], [0.72, 0.03]]
    btts: [[0.58, 0.01], [0.65, 0.02], [0.72, 0.03]]
  price_tolerance: 0.06     # skip if expected loss per unit staked is worse than 6%
  max_match_fraction: 0.04  # all markets on one match together: at most 4% of budget
  stop_loss_fraction: 0.30  # month down 30% of budget -> no more stakes that month
  stake_rounding: 10
  confidence: model         # model = our own probabilities only (Harsh's choice, 21 Nov 2026);
                            # market = the margin-free market probability when prices exist
  golden_bar:               # match-winner golden bar (Harsh, 22 Nov 2026): the model's favourite
    lo: 0.60                # inside its league's window. UNPROVEN: windows from
    hi: 0.64                # reports/window_both_above_50 (best in both periods per league) and
    by_league:              # checked on 2026/27 (reports/season_2026). Logged and settled by
      E0: [0.60, 0.64]      # `football-edge settle`. Judge at 200 settled picks.
      I1: [0.63, 0.68]
      SP1: [0.60, 0.64]
    log_path: bets/golden_bar.csv
  golden_ou:                # over/under 2.5 golden bar (Harsh, 22 Nov 2026): Premier League only,
    leagues: [E0]           # the model's over/under pick at 51-56%. UNPROVEN and it LOST on
    lo: 0.51                # 2026/27 so far (51-53%: -23% on 18; 52-56%: -4.9% on 29). Review at
    hi: 0.56                # 100 settled picks; drop if still losing.
    log_path: bets/golden_ou.csv
  golden_cs:                # correct-score golden bar (22 Nov 2026): back the likeliest score when
    lo: 0.12                # its chance is 12%+. UNPROVEN: in 2020-26 it hit 14.7% (break-even 6.80);
    log_path: bets/golden_cs.csv  # no historical correct-score prices exist. Judge at 200.
  disagree_at: 0.08         # flag picks where model and market differ by 8+ points
  doubles: {max_count: 2, stake_fraction: 0.01, min_leg_tier: high}
  log_path: bets/log.csv
news:                       # docs/news.md; any OpenAI-compatible chat server
  base_url: http://localhost:11434/v1   # Ollama on this PC
  model: qwen2.5:7b-instruct
  api_key_env: ""           # e.g. HF_TOKEN for a hosted endpoint; the key stays in the environment
  timeout_s: 120
  max_retries: 1
writer:                     # video scripts (docs/content.md); same Ollama server as news
  api: ollama               # Ollama's own API: lets us switch Gemma 4's thinking off
  base_url: http://localhost:11434
  think: false              # thinking used the whole answer budget on a CPU -> empty scripts
  num_ctx: 8192             # room for instructions + example + fact sheet + answer
  num_predict: 800          # a 150-word script is ~250 tokens
  model: gemma4:12b         # set to the exact tag `ollama list` shows on your PC
  timeout_s: 900            # CPU-only: a script can take a few minutes
  max_retries: 2            # rewrites allowed when a script fails the checks
  temperature: 0.8          # some variety for natural prose; facts are enforced by the checks
content:
  big_clubs:                # matches involving these count as "searched for" (picker rule 3)
    E0: [Arsenal, Chelsea, Liverpool, Man City, Man United, Tottenham, Newcastle, Aston Villa]
    I1: [Inter, Milan, Juventus, Napoli, Roma, Lazio, Atalanta]
    SP1: [Real Madrid, Barcelona, Ath Madrid, Ath Bilbao, Sevilla, Betis, Sociedad, Villarreal]
  videos_per_round: 3
  display_names:            # how the presenter says a club, where the automatic choice is wrong
    I1: {Milan: AC Milan}

trader:                     # private trader desk (docs/trader.md, ADR 0018): Harsh's PC only
  days: 3                   # Nox builds slips from matches in the next 3 days
  leg_range: [0.55, 0.85]   # good singles: below 55% is a coin flip, above 85% pays too little
  singles_per_match: 4      # best leg per bet family, up to this many per match
  parlays:                  # each = highest-paying mix of strong legs above its floor
    safe: {floor: 0.60, max_legs: 4, high_only: false}   # comes in 60%+ of the time
    risky: {floor: 0.25, max_legs: 5, high_only: true}   # 25%+, High-confidence legs only
  parlay_min_cost: 0.05     # every leg must cut the chance by 5+ points (no passengers)
  parlay_leg_max: 0.95      # legs up to 95% may sit inside a parlay
  parlay_pool: 12           # strongest legs per match considered
  include_corners: false    # corners are no longer forecast at all (ADR 0020): no skill
  no_skill_markets: [corners, oddeven]  # always weak: no model skill (ADR 0008, ADR 0018)
  count_lines:              # the lines Harsh's site offers (22 Nov 2026), over and under
    cards: [3.5, 4.5, 5.5]
  stake_by_risk:            # share of staking.monthly_budget per slip, by risk grade
    Low: 0.02
    Medium: 0.01
    High: 0.005
    Very high: 0.0025
  slips_path: bets/slips.csv  # saved slips, settled from results (kept out of git with bets/)

analyst:                    # match-analyst chat (docs/analyst.md): local LLM + our tools
  api: ollama
  base_url: http://localhost:11434
  model: qwen3:8b           # chosen 22 Nov: same eval score as gemma4:12b, about 2x faster
                            # (reports/analyst/eval_*.md); gemma4:12b still works
  think: false
  temperature: 0.2          # low: answers should be faithful, not creative
  num_ctx: 8192
  num_predict: 500
  timeout_s: 600
  max_steps: 4              # tool rounds per question

tracking:                   # live prediction log and scorecard (docs/tracking.md, ADR 0019)
  predictions_dir: records/predictions  # committed to git: the public, timestamped proof
  posted_dir: records/posted            # committed: the calls posted on Instagram
  slips_dir: bets/desk_log              # private (bets/ is never committed): the desk's slips
  baseline_years: 3         # plain baseline = the league's own rate over the previous 3 years
  min_sample: 30            # below this many graded predictions a figure is "too few to judge"
  auto_push: true           # the daily run commits records/ (only records/) and pushes it, so
                            # GitHub's push time dates every block (ADR 0019 amendment)
  strong:                   # a strong call (posts page), from the 2020-26 track record only:
    min_hit: 0.65           # every past chance level from the call's up came true 65%+ ...
    min_band_n: 30          # ... (levels with 30+ past calls count) ...
    min_class_n: 100        # ... and 100+ past calls in total. Since calibration (ADR 0020):
                            # favourites at 65%+ and over/under 2.5 at 65%+

calibration:                # ADR 0020: goals and cards calibration, fitted on earlier seasons only
  enabled: true             # false = raw model numbers everywhere
  path: reports/calibration/calibration.json  # written by `football-edge calibrate`; only maps
                            # that passed the pre-registered test are marked adopted and used
